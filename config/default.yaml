                    
# JOINT ORDER: [pinky, ring, middle, index, thumb2, thumb1]

# Human hand joint angle limits (degrees)
human_hand_joint_min: [95, 90, 90, 90, 120, 98]  # Minimum angles 
human_hand_joint_max: [160, 165, 165, 170, 170, 130]  # Maximum angles

# Inspire hand joint angle limits (scaled 0-1000)
inspire_hand_joint_min: [0, 0, 0, 0, 0, 0]  # Minimum angles
inspire_hand_joint_max: [1000, 1000, 1000, 1000, 1000, 1000]  # Maximum angles

# Predefined angles for gestures
fist_angles: [0, 0, 0, 0, 0, 1000]  # Fist angles for Inspire hand
pinch_index_angles: [-1, -1, -1, 480, 550, 110]  # Pinch angles for Inspire hand (thumb touching index)

# Control smoothing factor (windowed average)
smoothing_factor: 0.25  # [0-1] low values for smoother control, high values for more responsive control

# Force threshold (limits joint movement to prevent excessive force)
force_threshold: 200 # [0-1000] lower values for less force

# Joint state feedback error margin
joint_feedback_error_margin: 10  # [0-1000] acceptable error margin for joint state feedback

# Thresholds for gestures
index_pinch_threshold: 0.06
fist_threshold: 0.19
